        <label for="gender_1">Male</label>
        <br>
        <br>
        <label for="how_often_do_you_use_chatgpt">How often do you use ChatGPT?</label>
            <select id="how_often_do_you_use_chatgpt" name="how_often_do_you_use_chatgpt" required>

                <option value="option2">Rarely</option>
                <option value="option3">Occasionally</option>
                <option value="option4">Often</option>
                <option value="option5">Constantly</option>
            </select>
    </form>
</body>
